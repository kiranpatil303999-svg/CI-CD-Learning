name: First CI Workflow

on:
  push:
    branches:
      - main

jobs:
  git-job:
   runs-on: ubuntu-latest
   steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List repository files
        run: ls

      - name: Git message
        run: echo "I am learning Git."

  github-job:
    needs: git-job
    runs-on: ubuntu-latest
    steps:
      - name: GitHub message
        run: echo "I am learning GitHub Actions."
